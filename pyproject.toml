[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coolhurst-booker"
version = "0.1.0"
description = "Coolhurst tennis court availability scraper PoC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.44.0",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "apscheduler>=3.10.4",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
]

[project.scripts]
coolhurst-scrape = "coolhurst_booker.jobs.scrape_job:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coolhurst_booker = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: live scrape tests requiring credentials",
]
